name: Continuous APK Build
on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 💎 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔑 Setup Google Services
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_BASE64 }}" | base64 --decode > ./app/google-services.json
            echo "Google Services JSON decoded."
          else
            echo "GOOGLE_SERVICES_BASE64 secret not set; skipping google-services.json creation."
          fi

      - name: 🛠 Configure Versioning & Package Name
        run: |
          # Update versionCode and versionName in app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ github.run_number }}/g" app/build.gradle.kts
          sed -i 's/versionName = "[^"]*"/versionName = "1.0.${{ github.run_number }}"/g' app/build.gradle.kts
          
          # IF ON DEV: Change Package Name so it doesn't overwrite Main App on phone
          if [ "${{ github.ref_name }}" == "dev" ]; then
            sed -i 's/applicationId = "[^"]*"/applicationId = "cc.youplex.movies.dev"/g' app/build.gradle.kts
            echo "Renamed package to cc.youplex.movies.dev for side-by-side install"
          fi

      - name: 📦 Build Local APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_ACCESS_TOKEN || secrets.TMDB_API_KEY }}
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi
          
          # Locate generated APK and copy to root output
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" ./youplex-latest.apk
            echo "APK generated at ./youplex-latest.apk"
          else
            echo "Error: APK not found!" && exit 1
          fi

      - name: 🚢 Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}${{ github.ref_name == 'dev' && '-dev' || '' }}
          name: Build v${{ github.run_number }} (${{ github.ref_name }})
          body: |
            **Youplex Build Update**
            - **Branch:** ${{ github.ref_name }}
            - **Build Number:** ${{ github.run_number }}
            - **Commit:** ${{ github.sha }}
          prerelease: ${{ github.ref_name == 'dev' }}
          make_latest: ${{ github.ref_name == 'main' }}
          files: ./youplex-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🗑️ Delete Old Releases
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
              try {
                const { data: releases } = await github.rest.repos.listReleases({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                });
              
                if (!releases || releases.length <= 3) {
                  console.log("Found 3 or fewer releases. Skipping cleanup.");
                  return;
                }
              
                const toDelete = releases.slice(3);
              
                for (const release of toDelete) {
                  console.log(`Deleting release ${release.tag_name}...`);
                  await github.rest.repos.deleteRelease({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: release.id,
                  });
              
                  try {
                    await github.rest.git.deleteRef({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ref: `tags/${release.tag_name}`,
                    });
                  } catch (e) {
                    console.log(`Tag for ${release.tag_name} already deleted.`);
                  }
                }
              } catch (err) {
                console.log("No releases found or error listing releases. Skipping.");
              }

      - name: 📢 Telegram Notification
        if: github.ref_name != 'dev' && secrets.TELEGRAM_TOKEN != ''
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🚀 *Youplex v${{ github.run_number }} is out!*
            🔗 [Download APK](https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/youplex-latest.apk)

      - name: 💬 Discord Notification
        if: github.ref_name != 'dev' && secrets.DISCORD_WEBHOOK != ''
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          content: "@everyone 📢 Youplex Update v${{ github.run_number }} is ready!"
          color: 0xE91E63
