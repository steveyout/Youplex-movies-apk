name: Continuous APK Build
on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 💎 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔑 Setup Google Services & Keystores
        run: |
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > debug.keystore
            echo "Decoded debug.keystore from secret DEBUG_KEYSTORE_BASE64."
          elif [ -f "debug.keystore.base64" ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore from debug.keystore.base64."
          fi
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
            echo "Decoded release.keystore from secret RELEASE_KEYSTORE_BASE64."
          elif [ -f "release.keystore.base64" ]; then
            base64 --decode release.keystore.base64 > release.keystore
            echo "Decoded release.keystore from release.keystore.base64."
          fi
          if [ -n "${{ secrets.GOOGLE_SERVICES_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_BASE64 }}" | base64 --decode > ./app/google-services.json
            echo "Google Services JSON decoded."
          else
            echo "GOOGLE_SERVICES_BASE64 secret not set; skipping google-services.json creation."
          fi

      - name: 📝 Inject Environment Variables into .env
        env:
          ENV_BASE64: ${{ secrets.ENV_BASE64 || secrets.ENV_FILE_BASE64 }}
          TMDB_API_KEY: ${{ secrets.TMDB_ACCESS_TOKEN || secrets.TMDB_API_KEY || vars.TMDB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
        run: |
          if [ -n "$ENV_BASE64" ]; then
            echo "$ENV_BASE64" | base64 --decode > .env
            echo ".env file decoded successfully from ENV_BASE64 secret."
          else
            echo "# Auto-generated .env for GitHub Actions build" > .env
            if [ -n "$TMDB_API_KEY" ]; then
              echo "TMDB_API_KEY=$TMDB_API_KEY" >> .env
            else
              echo "TMDB_API_KEY=addfba41d0cb5aba2ebaae12ac92b671" >> .env
            fi
            if [ -n "$GEMINI_API_KEY" ]; then
              echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
            fi
            echo ".env file generated successfully from individual secrets."
          fi
          echo "Keys present in .env:"
          cut -d= -f1 .env

      - name: 🛠 Configure Versioning & Package Name
        run: |
          # Update versionCode and versionName in app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ github.run_number }}/g" app/build.gradle.kts
          sed -i 's/versionName = "[^"]*"/versionName = "1.0.${{ github.run_number }}"/g' app/build.gradle.kts
          
          # IF ON DEV: Change Package Name so it doesn't overwrite Main App on phone
          if [ "${{ github.ref_name }}" == "dev" ]; then
            sed -i 's/applicationId = "[^"]*"/applicationId = "cc.youplex.movies.dev"/g' app/build.gradle.kts
            echo "Renamed package to cc.youplex.movies.dev for side-by-side install"
          fi

      - name: 📱 Build Mobile APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_ACCESS_TOKEN || secrets.TMDB_API_KEY }}
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace --info
          else
            gradle assembleDebug --no-daemon --stacktrace --info
          fi
          
          # Locate generated Mobile APK and copy
          MOBILE_APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$MOBILE_APK_PATH" ]; then
            cp "$MOBILE_APK_PATH" ./youplex-mobile.apk
            cp "$MOBILE_APK_PATH" ./youplex-latest.apk
            echo "Mobile APK generated at ./youplex-mobile.apk & ./youplex-latest.apk"
          else
            echo "Error: Mobile APK not found!" && exit 1
          fi

      - name: 📺 Build Android TV APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_ACCESS_TOKEN || secrets.TMDB_API_KEY }}
        run: |
          # Clean previous build artifacts
          rm -rf app/build/outputs/apk
          
          # Configure TV Package Application ID
          if [ "${{ github.ref_name }}" == "dev" ]; then
            sed -i 's/applicationId = "[^"]*"/applicationId = "cc.youplex.movies.tv.dev"/g' app/build.gradle.kts
          else
            sed -i 's/applicationId = "[^"]*"/applicationId = "cc.youplex.movies.tv"/g' app/build.gradle.kts
          fi
          
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace --info
          else
            gradle assembleDebug --no-daemon --stacktrace --info
          fi
          
          # Locate generated TV APK and copy
          TV_APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$TV_APK_PATH" ]; then
            cp "$TV_APK_PATH" ./youplex-tv.apk
            echo "Android TV APK generated at ./youplex-tv.apk"
          else
            echo "Error: Android TV APK not found!" && exit 1
          fi

      - name: 🚢 Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}${{ github.ref_name == 'dev' && '-dev' || '' }}
          name: Build v${{ github.run_number }} (${{ github.ref_name }})
          body: |
            **Youplex Build Update**
            - **Branch:** ${{ github.ref_name }}
            - **Build Number:** ${{ github.run_number }}
            - **Commit:** ${{ github.sha }}

            ### 📦 Included Downloads:
            - 📱 **Mobile App:** `youplex-mobile.apk` (Phone & Tablet)
            - 📺 **Android TV App:** `youplex-tv.apk` (Android TV & Leanback)
          prerelease: ${{ github.ref_name == 'dev' }}
          make_latest: ${{ github.ref_name == 'main' }}
          files: |
            ./youplex-latest.apk
            ./youplex-mobile.apk
            ./youplex-tv.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🗑️ Delete Old Releases
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
              try {
                const { data: releases } = await github.rest.repos.listReleases({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                });
              
                if (!releases || releases.length <= 3) {
                  console.log("Found 3 or fewer releases. Skipping cleanup.");
                  return;
                }
              
                const toDelete = releases.slice(3);
              
                for (const release of toDelete) {
                  console.log(`Deleting release ${release.tag_name}...`);
                  await github.rest.repos.deleteRelease({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: release.id,
                  });
              
                  try {
                    await github.rest.git.deleteRef({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ref: `tags/${release.tag_name}`,
                    });
                  } catch (e) {
                    console.log(`Tag for ${release.tag_name} already deleted.`);
                  }
                }
              } catch (err) {
                console.log("No releases found or error listing releases. Skipping.");
              }

      - name: 📢 Telegram Notification
        if: github.ref_name != 'dev' && env.TELEGRAM_TOKEN != ''
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🚀 *Youplex v${{ github.run_number }} is out!*

            📱 [Download Mobile APK](https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/youplex-mobile.apk)
            📺 [Download Android TV APK](https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/youplex-tv.apk)
            📥 [View All Releases](https://github.com/${{ github.repository }}/releases/latest)

      - name: 💬 Discord Notification
        if: github.ref_name != 'dev' && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "🚀 Youplex v${{ github.run_number }} Release"
          url: "https://github.com/${{ github.repository }}/releases/latest"
          description: |
            📢 **Youplex Update v${{ github.run_number }} is ready!**

            📱 **Mobile Edition:** [Download youplex-mobile.apk](https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/youplex-mobile.apk)
            📺 **Android TV Edition:** [Download youplex-tv.apk](https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/youplex-tv.apk)
            📥 **Release Page:** [View Release Notes](https://github.com/${{ github.repository }}/releases/latest)
          content: "@everyone 📢 Youplex Update v${{ github.run_number }} (Mobile & TV) is ready!"
          color: 0xE91E63
